spring:
  application:
    name: CitiesOverTimeJava
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/citiesovertime}  # Changed to match your actual DB name
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:morocaan}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection.provider_disables_autocommit: true  # Added for transaction stability
  main:
    lazy-initialization: true
    banner-mode: off  # Cleaner startup logs

server:
  port: ${PORT:8081}
  ssl:
    enabled: false

logging:
  level:
    root: INFO
    org:
      springframework:
        web: DEBUG
        jpa: DEBUG
      hibernate:
        SQL: DEBUG
        type: TRACE
    com:
      yourpackage: DEBUG  # Replace with your actual base package

jwt:
  secret: ${JWT_SECRET:default_fallback_secret}
  expiration-ms: 86400000